<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="120" rx="4" fill="#F5F5F5"/>
    <g transform="translate(20,20)">
        <!-- Gantt chart bars -->
        <rect x="10" y="10" width="60" height="10" rx="2" fill="#E5E5E5"/>
        <rect x="20" y="30" width="40" height="10" rx="2" fill="#E5E5E5"/>
        <rect x="30" y="50" width="50" height="10" rx="2" fill="#E5E5E5"/>
        <!-- Timeline markers -->
        <line x1="0" y1="0" x2="80" y2="0" stroke="#D1D1D1" stroke-width="2"/>
        <line x1="0" y1="80" x2="80" y2="80" stroke="#D1D1D1" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="80" stroke="#D1D1D1" stroke-width="2"/>
        <line x1="80" y1="0" x2="80" y2="80" stroke="#D1D1D1" stroke-width="2"/>
    </g>
</svg> 